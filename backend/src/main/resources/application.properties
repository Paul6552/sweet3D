# --- HTTP ---
quarkus.http.port=8180
quarkus.http.test-port=8181
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173

# --- Datenbank (eigener Container sweet3d-postgres, siehe ../docker-compose.yml) ---
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5442/sweet3d
quarkus.datasource.username=sweet3d
quarkus.datasource.password=${SWEET3D_DB_PASSWORD}
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5442/sweet3d_test
quarkus.hibernate-orm.schema-management.strategy=none
# Projektinhalt (JsonNode) wird unverändert gespeichert, unabhängig von REST-Einstellungen
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false

# --- Auth (eigener Container sweet3d-keycloak, Realm sweet3d) ---
quarkus.oidc.auth-server-url=http://localhost:8190/realms/sweet3d
quarkus.oidc.application-type=service
quarkus.oidc.client-id=sweet3d-backend
quarkus.http.auth.permission.catalog.paths=/api/catalog/*
quarkus.http.auth.permission.catalog.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# --- Katalog ---
sweet3d.catalog.languages=de,en,fr,es,it
