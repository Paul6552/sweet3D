server {
    listen 80;
    root /usr/share/nginx/html;

    # Katalog (Modelle, Symbole, Texturen) und gebaute Assets lange cachen
    location /catalog/ {
        add_header Cache-Control "public, max-age=86400";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-Page-App: /editor/... liefert index.html
    location / {
        try_files $uri /index.html;
    }
}
