name: sweet3d

services:
  sweet3d-postgres:
    image: postgres:18
    container_name: sweet3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      SWEET3D_DB_PASSWORD: ${SWEET3D_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - sweet3d-pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keycloak && pg_isready -U postgres -d sweet3d"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sweet3d-net

  sweet3d-keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: sweet3d-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://sweet3d-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_PORT: 8190
      KC_HOSTNAME: http://localhost:8190
      # Backend im Container erreicht Keycloak intern unter sweet3d-keycloak (JWKS usw.)
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8190:8190"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      sweet3d-postgres:
        condition: service_healthy
    networks:
      - sweet3d-net

  sweet3d-backend:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: backend/src/main/docker/Dockerfile
    container_name: sweet3d-backend
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://sweet3d-postgres:5432/sweet3d
      QUARKUS_DATASOURCE_USERNAME: sweet3d
      QUARKUS_DATASOURCE_PASSWORD: ${SWEET3D_DB_PASSWORD}
      QUARKUS_OIDC_AUTH_SERVER_URL: http://sweet3d-keycloak:8190/realms/sweet3d
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8190/realms/sweet3d
      SWEET3D_ASSETS_DIR: /data/assets
    ports:
      - "8180:8180"
    volumes:
      - sweet3d-assets:/data/assets
    depends_on:
      sweet3d-postgres:
        condition: service_healthy
      sweet3d-keycloak:
        condition: service_started
    networks:
      - sweet3d-net

volumes:
  sweet3d-pgdata:
  sweet3d-assets:

networks:
  sweet3d-net:
    name: sweet3d-net
